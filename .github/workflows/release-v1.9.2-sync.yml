name: One-shot v1.9.2 sync

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.event.issue.title == '[internal] v1.9.2 sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify v1.9.2
        shell: bash
        run: |
          set -euo pipefail
          cat .release_tmp/js_gz_*.b64 | base64 -d | gzip -d > src/EngineeringTableCleaner.js
          echo 'eee164cc2ed33a5872aa815557eeb3ce2e0a15a974f3a77bfd31b99b6b01a201  src/EngineeringTableCleaner.js' | sha256sum -c -
          echo 'd850066910d69793ca31a80942c18e986e1570c8267af1a7605431ffaf74a651  src/customUI.xml' | sha256sum -c -
          node --check src/EngineeringTableCleaner.js

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.sax.saxutils import escape
          import hashlib

          source_path = Path('src/EngineeringTableCleaner.js')
          ui_path = Path('src/customUI.xml')
          template_path = Path('release/工程表清理助手_v1.8.0.xlam')
          output_path = Path('release/工程表清理助手_v1.9.2.xlam')

          js = source_path.read_text(encoding='utf-8-sig')
          jde = (
              "<?xml version='1.0' encoding='utf-8'?>\n"
              '<document version="2.0">\n'
              '<name>Project</name>\n'
              '<property desc="工程表清理助手 v1.9.2" lock="false" password="" />\n'
              '<activemodule>1</activemodule>\n'
              '<codemodule name="EngineeringTableCleaner" id="1">'
              '<window cursorpos="0" actived="true" visible="true" />'
              '<codetext>' + escape(js) + '</codetext></codemodule>\n'
              '<functionsdata />\n'
              '</document>'
          ).encode('utf-8')
          ui = ui_path.read_bytes()

          assert hashlib.sha256(jde).hexdigest() == '9ab0e2d231f65b6d674d478c331ebb6bcb2649c00da86afbe4e1c108e3c41978'
          assert hashlib.sha256(ui).hexdigest() == 'd850066910d69793ca31a80942c18e986e1570c8267af1a7605431ffaf74a651'

          with ZipFile(template_path, 'r') as zin, ZipFile(output_path, 'w') as zout:
              for info in zin.infolist():
                  if info.filename == 'xl/JDEData.bin':
                      data = jde
                  elif info.filename == 'customUI/customUI.xml':
                      data = ui
                  else:
                      data = zin.read(info.filename)
                  zout.writestr(info, data)

          with ZipFile(output_path, 'r') as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read('xl/JDEData.bin')).hexdigest() == '9ab0e2d231f65b6d674d478c331ebb6bcb2649c00da86afbe4e1c108e3c41978'
              assert hashlib.sha256(z.read('customUI/customUI.xml')).hexdigest() == 'd850066910d69793ca31a80942c18e986e1570c8267af1a7605431ffaf74a651'
          PY

          {
            echo 'WPS工程表清理助手 v1.9.2'
            echo 'SHA256'
            sha256sum 'release/工程表清理助手_v1.9.2.xlam'
            sha256sum 'src/EngineeringTableCleaner.js'
          } > docs/CHECKSUM_v1.9.2.txt

          rm -rf .release_tmp
          rm -f .github/workflows/release-v1.9.2-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v1.9.2: sync source and XLAM'
          git push

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
