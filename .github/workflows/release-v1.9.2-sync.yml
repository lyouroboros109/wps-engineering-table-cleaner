name: One-shot v1.9.2 sync

on:
  push:
    branches: [main]
    paths:
      - '.release_tmp/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v1.9.2 source and XLAM
        shell: bash
        run: |
          set -euo pipefail
          cat .release_tmp/js_gz_*.b64 | base64 -d | gzip -d > src/EngineeringTableCleaner.js
          mkdir -p release
          cat .release_tmp/xlam_*.b64 | base64 -d > 'release/工程表清理助手_v1.9.2.xlam'
          echo '1e5d253d1bfe8b0b2a35fc14f525a2082a3541a3fff9e07e064350e33fab4867  release/工程表清理助手_v1.9.2.xlam' | sha256sum -c -
          node --check src/EngineeringTableCleaner.js
          rm -rf .release_tmp
          rm -f .github/workflows/release-v1.9.2-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v1.9.2: sync source and XLAM'
          git push
